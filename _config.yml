# GitHub Pages Konfiguration für saubere URLs
permalink: pretty
baseurl: ""
url: "https://pero030.github.io/alo-academy"

# Saubere URLs ohne .html Endung
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude Dateien vom Build
exclude:
  - README.md
  - .gitignore
  - .git
